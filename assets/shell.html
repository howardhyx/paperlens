<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>@@TITLE@@ · 论文论证精读</title><style>@@FONTS@@
@@CSS@@</style></head>
<body id="top" data-storage-key="@@STORAGE_KEY@@"><a class="skip-link" href="#main">跳至论文正文</a>
@@HEADER@@
<nav class="section-nav" aria-label="章节导航"><div class="legend-strip"><div class="wrap"><div class="legend" aria-label="颜色图例，点击可切换高亮">@@LEGEND@@</div></div></div><div class="wrap nav-inner"><div class="nav-links">@@NAV@@</div><div class="nav-tools"><select id="jump" aria-label="跳转小节或图版"><option value="">跳转小节 / 图版</option>@@OPTIONS@@</select><div class="search-box"><input id="search" type="search" placeholder="查找英文 / 中文" aria-label="查找段落"><button id="search-prev" aria-label="上一个匹配">↑</button><button id="search-next" aria-label="下一个匹配">↓</button><output id="search-count" aria-live="polite"></output></div><div class="view-controls"><label><input type="checkbox" id="show-cn" checked>中文译文</label><label><input type="checkbox" id="show-notes" checked>中文批注</label><button class="text-button" id="print">打印 / PDF</button></div></div></div><div class="progress" aria-hidden="true"><span id="progress"></span></div></nav>
<main id="main" class="wrap"><div class="column-headings"><div><b>原文与译文</b></div><div><b>批注</b></div></div>@@CONTENT@@@@OVERVIEW@@@@COVERAGE@@@@SOURCE@@</main>
<footer><div class="wrap"><a href="#top">返回顶部 ↑</a></div></footer>
<dialog id="source-dialog" class="dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><div class="dialog-toolbar"><h2 id="dialog-title">原页核对</h2><button id="dialog-prev" aria-label="上一页">← 上一页</button><button id="dialog-next" aria-label="下一页">下一页 →</button><button id="dialog-zoom">原始尺寸</button><button id="dialog-close" autofocus>关闭 ×</button></div><div class="dialog-scroll" id="dialog-scroll"><img id="dialog-image" alt="论文原页"></div><div class="dialog-footer" id="dialog-footer">来源：用户提供的论文PDF</div></div></dialog>
<noscript><p class="wrap">文字内容可直接阅读；启用JavaScript可查看内嵌图版、原页和交互导航。</p></noscript><script id="image-data" type="application/json">@@IMAGES@@</script><script>@@JS@@</script></body></html>
